name: predict

on:
  schedule:
    - cron: "15 6 * * *"   # morning run: new fixtures + odds
    - cron: "15 15 * * *"  # afternoon run: late odds, settle early kick-offs
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also rebuild the walk-forward backtest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r requirements.txt

      # Past-season CSVs never change; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: fd-${{ github.run_id }}
          restore-keys: fd-

      - run: python -m pytest -q

      - if: inputs.backtest
        run: python -m footballseer backtest

      - if: inputs.backtest
        run: python -m footballseer basketball backtest

      - run: python -m footballseer run

      # Basketball is a bonus on top of football: a failure here must not block the football commit.
      - run: python -m footballseer basketball run
        continue-on-error: true

      - name: Commit data
        working-directory: .
        run: |
          git config user.name "footballseer-bot"
          git config user.email "footballseer-bot@users.noreply.github.com"
          git add web/public/data data
          git diff --cached --quiet && exit 0
          git commit -m "data: predictions for $(date -u +%F)"
          git push
